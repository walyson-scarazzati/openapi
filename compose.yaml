services:
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    ports:
      - "8080:8080"
    environment:
      SWAGGER_JSON: /openapi.yml
    volumes:
      - ./openapi_01.yml:/openapi.yml:ro

  swagger-editor:
    image: swaggerapi/swagger-editor:latest
    ports:
      - "8081:80"
    volumes:
      - ./openapi_01.yml:/usr/share/nginx/html/openapi_01.yml:ro

  swagger-generator:
    image: swaggerapi/swagger-generator:latest
    ports:
      - "8082:8080"
    environment:
      GENERATOR_HOST: http://localhost:8082
